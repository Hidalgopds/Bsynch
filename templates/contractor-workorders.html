<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Orders – Contractor</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/themes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;}
header{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e2533;background:#0f1117;position:sticky;top:0;z-index:50;}
.logo-badge{width:32px;height:32px;background:linear-gradient(135deg,#1e9484,#4f8ef7);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;}
.hdr-title{font-size:16px;font-weight:700;}
.hdr-sep{color:#334155;margin:0 2px;}
.hdr-sub{font-size:14px;color:#64748b;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.btn-back{padding:5px 12px;background:none;border:1px solid #334155;border-radius:7px;color:#94a3b8;font-size:12px;cursor:pointer;text-decoration:none;line-height:1.4;}
.btn-back:hover{border-color:#1e9484;color:#1e9484;}
.btn-new{padding:6px 14px;background:#1e9484;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.btn-new:hover{background:#178070;}
.filter-bar{padding:12px 20px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid #1e2533;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{padding:5px 14px;border-radius:20px;border:1px solid #2a2d3e;background:none;color:#94a3b8;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;}
.filter-chip.active{background:#1e9484;border-color:#1e9484;color:#fff;}
.filter-chip:hover:not(.active){border-color:#1e9484;color:#1e9484;}
.wo-list{flex:1;padding:16px 20px;max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.empty-state{text-align:center;padding:60px 20px;color:#475569;}
.empty-state .icon{font-size:48px;margin-bottom:12px;}

/* WO Card */
.wo-card{background:#1a1d27;border:1px solid #2a2d3e;border-radius:14px;padding:18px 20px;cursor:pointer;transition:border-color .15s,transform .12s;}
.wo-card:hover{border-color:#1e9484;transform:translateY(-1px);}
.wo-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.wo-card-info{flex:1;min-width:0;}
.wo-number{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.wo-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wo-client{font-size:13px;color:#94a3b8;margin-top:2px;}
.wo-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.wo-pct{font-size:13px;font-weight:700;color:#1e9484;width:36px;flex-shrink:0;}
.prog-track{flex:1;height:6px;background:#1e2533;border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#1e9484,#4f8ef7);transition:width .4s ease;}
.wo-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.s-open{background:rgba(79,142,247,.14);color:#4f8ef7;}
.s-in_progress{background:rgba(34,197,94,.12);color:#22c55e;}
.s-on_hold{background:rgba(245,158,11,.12);color:#f59e0b;}
.s-completed{background:rgba(100,116,139,.12);color:#64748b;}
.s-cancelled{background:rgba(239,68,68,.1);color:#ef4444;}
.priority-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.p-urgent{background:rgba(239,68,68,.1);color:#ef4444;}
.p-high{background:rgba(245,158,11,.12);color:#f59e0b;}
.p-normal{background:rgba(100,116,139,.08);color:#94a3b8;}
.p-low{background:rgba(100,116,139,.06);color:#64748b;}
.wo-due{font-size:12px;color:#64748b;}
.wo-proj{font-size:12px;color:#4f8ef7;}
.wo-steps-count{font-size:12px;color:#64748b;}

/* Detail Panel */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;opacity:0;transition:opacity .2s;}
.panel-overlay.open{display:block;opacity:1;}
.detail-panel{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:#111520;border-left:1px solid #1e2533;z-index:101;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
.detail-panel.open{transform:translateX(0);}
.panel-head{padding:16px 20px;border-bottom:1px solid #1e2533;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.panel-close{background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;line-height:1;padding:2px 8px;}
.panel-close:hover{color:#e2e8f0;}
.panel-job-number{font-size:11px;font-weight:700;color:#1e9484;text-transform:uppercase;letter-spacing:.5px;}
.panel-title{font-size:16px;font-weight:700;}
/* Overall progress in panel head */
.panel-pct-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.panel-pct-num{font-size:22px;font-weight:800;color:#1e9484;}
.panel-pct-label{font-size:12px;color:#64748b;}
.panel-prog-track{flex:1;height:8px;background:#1e2533;border-radius:5px;overflow:hidden;}
.panel-prog-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#1e9484,#4f8ef7);transition:width .5s ease;}

/* Tabs */
.panel-tabs{display:flex;border-bottom:1px solid #1e2533;flex-shrink:0;}
.ptab{flex:1;padding:10px 6px;text-align:center;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.ptab.active{color:#1e9484;border-bottom-color:#1e9484;}
.ptab:hover:not(.active){color:#94a3b8;}
.panel-body{flex:1;overflow-y:auto;padding:20px;}
.panel-body::-webkit-scrollbar{width:4px;}
.panel-body::-webkit-scrollbar-thumb{background:#2a2d3e;border-radius:4px;}

/* Info tab */
.field-row{margin-bottom:16px;}
.field-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field-value{font-size:14px;color:#e2e8f0;line-height:1.5;}
.field-value.muted{color:#64748b;}
.status-select{width:100%;padding:8px 12px;background:#1a1d27;border:1px solid #2a2d3e;border-radius:8px;color:#e2e8f0;font-size:14px;}
.status-select:focus{outline:none;border-color:#1e9484;}
.edit-area{background:#0f1117;border-radius:12px;padding:16px;margin-top:16px;border:1px solid #1e2533;}
.edit-area h4{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.editable-input{width:100%;padding:7px 10px;background:#1a1d27;border:1px solid #2a2d3e;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;margin-bottom:8px;}
.editable-input:focus{outline:none;border-color:#1e9484;}
.btn-row{display:flex;gap:8px;margin-top:8px;}
.btn-save{padding:7px 16px;background:#1e9484;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.btn-save:hover{background:#178070;}
.delete-btn{padding:7px 14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#ef4444;font-size:13px;cursor:pointer;}
.delete-btn:hover{background:rgba(239,68,68,.15);}

/* Steps tab */
.steps-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.steps-header h4{font-size:13px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;}
.btn-add-step{padding:5px 12px;background:rgba(30,148,132,.12);border:1px solid #1e9484;border-radius:7px;color:#1e9484;font-size:12px;cursor:pointer;}
.btn-add-step:hover{background:rgba(30,148,132,.22);}
.btn-add-step:disabled{opacity:.4;cursor:not-allowed;}
.step-item{background:#1a1d27;border:1px solid #2a2d3e;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.step-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.step-order{width:22px;height:22px;background:#0f1117;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#64748b;flex-shrink:0;}
.step-name-input{flex:1;background:none;border:none;border-bottom:1px solid #2a2d3e;color:#e2e8f0;font-size:14px;font-weight:600;padding:2px 0;font-family:inherit;}
.step-name-input:focus{outline:none;border-bottom-color:#1e9484;}
.step-del{background:none;border:none;color:#334155;font-size:16px;cursor:pointer;padding:2px 4px;line-height:1;flex-shrink:0;}
.step-del:hover{color:#ef4444;}
.step-pct-row{display:flex;align-items:center;gap:10px;}
.step-prog-track{flex:1;height:8px;background:#0f1117;border-radius:5px;overflow:hidden;cursor:pointer;}
.step-prog-fill{height:100%;border-radius:5px;transition:width .3s ease;}
.step-pct-input{width:64px;padding:5px 8px;background:#0f1117;border:1px solid #2a2d3e;border-radius:7px;color:#e2e8f0;font-size:13px;font-weight:700;text-align:center;}
.step-pct-input:focus{outline:none;border-color:#1e9484;}
.steps-save-row{margin-top:4px;}

/* Color for step progress based on value */
.sfill-low{background:linear-gradient(90deg,#ef4444,#f59e0b);}
.sfill-mid{background:linear-gradient(90deg,#f59e0b,#4f8ef7);}
.sfill-high{background:linear-gradient(90deg,#1e9484,#22c55e);}
.sfill-done{background:linear-gradient(90deg,#22c55e,#4ade80);}

/* Materials tab */
.add-mat-form{background:#1a1d27;border:1px solid #2a2d3e;border-radius:12px;padding:14px;margin-bottom:14px;}
.add-mat-form h4{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.form-row{display:grid;grid-template-columns:1fr 70px 80px;gap:8px;margin-bottom:8px;}
.form-input{padding:8px 10px;background:#0f1117;border:1px solid #2a2d3e;border-radius:8px;color:#e2e8f0;font-size:13px;width:100%;}
.form-input:focus{outline:none;border-color:#1e9484;}
.btn-add-mat{padding:7px;background:#1e9484;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;width:100%;}
.mat-item{background:#1a1d27;border:1px solid #2a2d3e;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mat-info{flex:1;}
.mat-name{font-size:14px;font-weight:600;}
.mat-detail{font-size:12px;color:#64748b;margin-top:2px;}
.mat-cost{font-size:13px;font-weight:700;color:#1e9484;white-space:nowrap;}
.mat-del{background:none;border:none;color:#475569;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;}
.mat-del:hover{color:#ef4444;}

/* Photos tab */
.photo-upload-area{border:2px dashed #2a2d3e;border-radius:12px;padding:20px;text-align:center;margin-bottom:14px;cursor:pointer;transition:border-color .15s;}
.photo-upload-area:hover{border-color:#1e9484;}
.photo-upload-area p{font-size:13px;color:#64748b;margin-top:6px;}
#photoFileInput{display:none;}
.photo-type-select,.photo-caption-input{width:100%;padding:7px 10px;background:#1a1d27;border:1px solid #2a2d3e;border-radius:8px;color:#e2e8f0;font-size:13px;margin-top:8px;}
.btn-upload-photo{display:none;padding:8px;background:#1e9484;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;}
.btn-upload-photo.visible{display:block;}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.photo-card{background:#1a1d27;border:1px solid #2a2d3e;border-radius:10px;overflow:hidden;}
.photo-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer;}
.photo-foot{padding:8px 10px;display:flex;align-items:center;gap:6px;}
.photo-caption-txt{font-size:12px;color:#64748b;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.photo-del{background:none;border:none;color:#475569;font-size:14px;cursor:pointer;padding:2px;}
.photo-del:hover{color:#ef4444;}
.photo-type-lbl{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;}
.pt-before{background:rgba(245,158,11,.12);color:#f59e0b;}
.pt-progress{background:rgba(79,142,247,.12);color:#4f8ef7;}
.pt-after{background:rgba(34,197,94,.12);color:#22c55e;}
.pt-other{background:#1e2533;color:#64748b;}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:90vw;max-height:88vh;border-radius:8px;object-fit:contain;}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;}

/* Create modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:#111520;border:1px solid #1e2533;border-radius:18px;width:100%;max-width:560px;padding:26px 24px;margin:auto;}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-section{margin-bottom:18px;}
.modal-section-title{font-size:12px;font-weight:700;color:#1e9484;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #1e2533;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 11px;background:#1a1d27;border:1px solid #2a2d3e;border-radius:9px;color:#e2e8f0;font-size:14px;font-family:inherit;}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#1e9484;}
.form-group textarea{resize:vertical;min-height:70px;}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
/* Steps in create modal */
.step-field-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.step-field-num{width:22px;height:22px;background:#1a1d27;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#64748b;flex-shrink:0;}
.step-field-input{flex:1;padding:7px 10px;background:#1a1d27;border:1px solid #2a2d3e;border-radius:8px;color:#e2e8f0;font-size:13px;font-family:inherit;}
.step-field-input:focus{outline:none;border-color:#1e9484;}
.step-field-del{background:none;border:none;color:#334155;font-size:18px;cursor:pointer;line-height:1;padding:2px 4px;}
.step-field-del:hover{color:#ef4444;}
.btn-add-step-field{padding:6px 12px;background:rgba(30,148,132,.1);border:1px dashed #1e9484;border-radius:8px;color:#1e9484;font-size:12px;cursor:pointer;width:100%;margin-top:4px;}
.btn-add-step-field:hover{background:rgba(30,148,132,.2);}
.btn-add-step-field:disabled{opacity:.4;cursor:not-allowed;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn-cancel{padding:8px 18px;background:none;border:1px solid #334155;border-radius:8px;color:#94a3b8;font-size:14px;cursor:pointer;}
.btn-cancel:hover{border-color:#e2e8f0;color:#e2e8f0;}
.btn-submit{padding:8px 20px;background:#1e9484;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.btn-submit:hover{background:#178070;}
.spinner{text-align:center;padding:40px;color:#475569;}
</style>
</head>
<body>

<header>
  <div class="logo-badge">B</div>
  <span class="hdr-title">Contractor</span>
  <span class="hdr-sep">/</span>
  <span class="hdr-sub">Work Orders</span>
  <div class="hdr-right">
    <a href="/contractor/dashboard" class="btn-back">&#128202; Dashboard</a>
    <button class="btn-new" onclick="openCreate()">+ New Job</button>
    <a href="/contractor-hub" class="btn-back">&#8592; Hub</a>
  </div>
</header>

<div class="filter-bar">
  <button class="filter-chip active" data-status="">All</button>
  <button class="filter-chip" data-status="open">Open</button>
  <button class="filter-chip" data-status="in_progress">In Progress</button>
  <button class="filter-chip" data-status="on_hold">On Hold</button>
  <button class="filter-chip" data-status="completed">Completed</button>
  <button class="filter-chip" data-status="cancelled">Cancelled</button>
</div>

<div class="wo-list" id="woList"><div class="spinner">Loading...</div></div>

<!-- Detail panel -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="panel-head">
    <button class="panel-close" onclick="closePanel()">&#x2715;</button>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <div class="panel-job-number" id="panelJobNum"></div>
        <div class="panel-title" id="panelTitle"></div>
      </div>
      <div class="panel-pct-row">
        <div class="panel-pct-num" id="panelPct">0%</div>
        <div class="panel-prog-track"><div class="panel-prog-fill" id="panelProgFill" style="width:0%"></div></div>
        <div class="panel-pct-label">complete</div>
      </div>
    </div>
  </div>
  <div class="panel-tabs">
    <div class="ptab active" data-tab="steps" onclick="switchTab(this)">Steps</div>
    <div class="ptab" data-tab="info" onclick="switchTab(this)">Info</div>
    <div class="ptab" data-tab="materials" onclick="switchTab(this)">Materials</div>
    <div class="ptab" data-tab="photos" onclick="switchTab(this)">Photos</div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- Create modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <h2>&#128203; New Work Order</h2>

    <div class="modal-section">
      <div class="modal-section-title">Job Details</div>
      <div class="form-group"><label>Title *</label><input id="newTitle" placeholder="e.g. Roof panel repair – Bldg 3"></div>
      <div class="form-group"><label>Description</label><textarea id="newDesc" placeholder="What needs to be done..."></textarea></div>
      <div class="form-2col">
        <div class="form-group"><label>Client / Company</label><input id="newClient" placeholder="Client name"></div>
        <div class="form-group"><label>Location / Site</label><input id="newLocation" placeholder="Job site"></div>
      </div>
      <div class="form-2col">
        <div class="form-group"><label>Priority</label>
          <select id="newPriority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="newStatus"><option value="open">Open</option><option value="in_progress">In Progress</option><option value="on_hold">On Hold</option></select>
        </div>
      </div>
      <div class="form-2col">
        <div class="form-group"><label>Start Date</label><input id="newStart" type="date"></div>
        <div class="form-group"><label>Due Date</label><input id="newDue" type="date"></div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Project (optional)</div>
      <div class="form-group"><label>Assign to Project</label>
        <select id="newProject">
          <option value="">-- No project --</option>
        </select>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Steps (5 default, max 10)</div>
      <div id="stepFieldsContainer"></div>
      <button class="btn-add-step-field" id="addStepFieldBtn" onclick="addStepField()">+ Add Step</button>
    </div>

    <div class="modal-section">
      <div class="form-group"><label>Notes</label><textarea id="newNotes" rows="2" placeholder="Additional notes..."></textarea></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCreate()">Cancel</button>
      <button class="btn-submit" onclick="submitNewJob()">Create Job</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
  <img id="lightboxImg" src="">
</div>

<script>
// ── State ──
var allJobs = [];
var allProjects = [];
var currentFilter = '';
var openJobId = null;
var openJobData = null;
var currentTab = 'steps';
var selectedPhotoFile = null;
var userName = localStorage.getItem('mbrName') || localStorage.getItem('companyUser') || 'User';
var DEFAULT_STEPS = ['Site Assessment','Material Preparation','Structural Work','Quality Check','Final Inspection'];

// ── Boot ──
Promise.all([
  fetch('/api/contractor/jobs').then(function(r){return r.json();}),
  fetch('/api/contractor/projects').then(function(r){return r.json();})
]).then(function(results){
  allJobs = results[0];
  allProjects = results[1];
  renderList(allJobs);
  populateProjectSelect();
}).catch(function(){renderList([]);});

document.querySelectorAll('.filter-chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active');});
    chip.classList.add('active');
    currentFilter = chip.dataset.status;
    renderList(allJobs);
  });
});

// ── Render list ──
function renderList(jobs){
  var filtered = currentFilter ? jobs.filter(function(j){return j.status===currentFilter;}) : jobs;
  var el = document.getElementById('woList');
  if(!filtered.length){
    el.innerHTML='<div class="empty-state"><div class="icon">&#128203;</div><p>No work orders yet.<br>Tap <strong>+ New Job</strong> to create one.</p></div>';
    return;
  }
  el.innerHTML = filtered.map(function(j){
    var pct = parseFloat(j.progress_pct||0);
    var proj = allProjects.find(function(p){return p.id===j.project_id;});
    var fillClass = pct>=100?'sfill-done':pct>=60?'sfill-high':pct>=30?'sfill-mid':'sfill-low';
    return '<div class="wo-card" onclick="openPanel(\''+j.id+'\')">'+
      '<div class="wo-card-top"><div class="wo-card-info">'+
      '<div class="wo-number">'+esc(j.job_number)+'</div>'+
      '<div class="wo-title">'+esc(j.title)+'</div>'+
      (j.client_name?'<div class="wo-client">'+esc(j.client_name)+(j.location?' &middot; '+esc(j.location):'')+'</div>':'')+
      '</div></div>'+
      '<div class="wo-progress-row">'+
        '<span class="wo-pct">'+pct+'%</span>'+
        '<div class="prog-track"><div class="prog-fill '+fillClass+'" style="width:'+pct+'%"></div></div>'+
      '</div>'+
      '<div class="wo-card-meta">'+
        '<span class="status-badge s-'+j.status+'">'+statusLabel(j.status)+'</span>'+
        '<span class="priority-badge p-'+j.priority+'">'+ucfirst(j.priority)+'</span>'+
        (j.due_date?'<span class="wo-due">Due '+fmtDate(j.due_date)+'</span>':'')+
        (proj?'<span class="wo-proj">&#128196; '+esc(proj.name)+'</span>':'')+
      '</div></div>';
  }).join('');
}

// ── Panel ──
function openPanel(id){
  openJobId = id;
  openJobData = allJobs.find(function(j){return j.id===id;}) || null;
  if(!openJobData) return;
  document.getElementById('panelJobNum').textContent = openJobData.job_number;
  document.getElementById('panelTitle').textContent = openJobData.title;
  updatePanelProgress(parseFloat(openJobData.progress_pct||0));
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  // reset to steps tab
  document.querySelectorAll('.ptab').forEach(function(t){t.classList.remove('active');});
  document.querySelector('.ptab[data-tab="steps"]').classList.add('active');
  currentTab='steps';
  loadSteps();
}
function closePanel(){
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  openJobId=null; openJobData=null;
}
function updatePanelProgress(pct){
  document.getElementById('panelPct').textContent = Math.round(pct)+'%';
  document.getElementById('panelProgFill').style.width = pct+'%';
  var idx = allJobs.findIndex(function(j){return j.id===openJobId;});
  if(idx>=0){ allJobs[idx].progress_pct=pct; }
  if(openJobData) openJobData.progress_pct=pct;
}
function switchTab(el){
  document.querySelectorAll('.ptab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  currentTab=el.dataset.tab;
  if(currentTab==='steps') loadSteps();
  else if(currentTab==='info') renderInfoTab(openJobData);
  else if(currentTab==='materials') loadMaterials();
  else if(currentTab==='photos') loadPhotos();
}

// ── Steps tab ──
function loadSteps(){
  document.getElementById('panelBody').innerHTML='<div class="spinner">Loading...</div>';
  fetch('/api/contractor/jobs/'+openJobId+'/steps')
    .then(function(r){return r.json();})
    .then(renderSteps);
}

function stepFillClass(pct){
  if(pct>=100) return 'sfill-done';
  if(pct>=60) return 'sfill-high';
  if(pct>=30) return 'sfill-mid';
  return 'sfill-low';
}

function renderSteps(steps){
  var canAdd = steps.length < 10;
  var html = '<div class="steps-header">'
    +'<h4>Steps ('+steps.length+'/10)</h4>'
    +(canAdd?'<button class="btn-add-step" onclick="addNewStep()">+ Add Step</button>':'')
    +'</div>';

  if(!steps.length){
    html += '<div style="text-align:center;padding:30px;color:#475569;font-size:13px;">No steps yet. <a href="#" onclick="initDefaultSteps();return false;" style="color:#1e9484;">Initialize 5 default steps</a></div>';
  } else {
    steps.forEach(function(s){
      var pct = parseFloat(s.progress_pct||0);
      var fc = stepFillClass(pct);
      html += '<div class="step-item" id="step-'+s.id+'">'
        +'<div class="step-top">'
        +'<div class="step-order">'+(s.order_num+1)+'</div>'
        +'<input class="step-name-input" value="'+esc(s.step_name)+'" onblur="saveStepName(\''+s.id+'\',this.value)">'
        +'<button class="step-del" onclick="deleteStep(\''+s.id+'\')">&#215;</button>'
        +'</div>'
        +'<div class="step-pct-row">'
        +'<div class="step-prog-track" onclick="clickStepTrack(event,\''+s.id+'\',this)">'
        +'<div class="step-prog-fill '+fc+'" id="sfill-'+s.id+'" style="width:'+pct+'%"></div>'
        +'</div>'
        +'<input class="step-pct-input" type="number" min="0" max="100" value="'+Math.round(pct)+'" '
        +'onchange="saveStepPct(\''+s.id+'\',this.value)" id="sinput-'+s.id+'">'
        +'</div>'
        +'</div>';
    });
  }
  document.getElementById('panelBody').innerHTML = html;
}

function clickStepTrack(e, stepId, trackEl){
  var rect = trackEl.getBoundingClientRect();
  var pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
  pct = Math.max(0, Math.min(100, pct));
  document.getElementById('sinput-'+stepId).value = pct;
  saveStepPct(stepId, pct);
}

function saveStepPct(stepId, val){
  var pct = Math.max(0, Math.min(100, parseFloat(val)||0));
  var fill = document.getElementById('sfill-'+stepId);
  if(fill){ fill.style.width=pct+'%'; fill.className='step-prog-fill '+stepFillClass(pct); }
  fetch('/api/contractor/jobs/'+openJobId+'/steps/'+stepId, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({progress_pct: pct})
  }).then(function(r){return r.json();}).then(function(res){
    if(res.ok && res.job_progress_pct !== undefined){
      updatePanelProgress(res.job_progress_pct);
      renderList(allJobs);
    }
  });
}

function saveStepName(stepId, name){
  if(!name.trim()) return;
  fetch('/api/contractor/jobs/'+openJobId+'/steps/'+stepId, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({step_name: name.trim()})
  });
}

function deleteStep(stepId){
  if(!confirm('Remove this step?')) return;
  fetch('/api/contractor/jobs/'+openJobId+'/steps/'+stepId, {method:'DELETE'})
    .then(function(r){return r.json();}).then(function(res){
      if(res.ok){ loadSteps(); }
    });
}

function addNewStep(){
  var name = prompt('Step name:', 'New Step');
  if(!name || !name.trim()) return;
  // Get current steps to determine order
  fetch('/api/contractor/jobs/'+openJobId+'/steps')
    .then(function(r){return r.json();})
    .then(function(steps){
      if(steps.length >= 10){ alert('Maximum 10 steps per job.'); return; }
      var orderNum = steps.length;
      fetch('/api/contractor/jobs/'+openJobId+'/steps', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({step_name:name.trim(), order_num:orderNum})
      }).then(function(){loadSteps();});
    });
}

function initDefaultSteps(){
  fetch('/api/contractor/jobs/'+openJobId+'/steps', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({steps: DEFAULT_STEPS})
  }).then(function(r){return r.json();}).then(function(res){
    if(res.ok) loadSteps();
    else alert('Error: '+res.error);
  });
}

// ── Info tab ──
function renderInfoTab(j){
  var proj = allProjects.find(function(p){return p.id===j.project_id;});
  var html = '<div class="field-row"><div class="field-label">Status</div>'
    +'<select class="status-select" onchange="updateStatus(this.value)">'
    +['open','in_progress','on_hold','completed','cancelled'].map(function(s){
      return '<option value="'+s+'"'+(j.status===s?' selected':'')+'>'+statusLabel(s)+'</option>';
    }).join('')+'</select></div>';
  html += '<div class="field-row"><div class="field-label">Priority</div>'
    +'<span class="priority-badge p-'+j.priority+'">'+ucfirst(j.priority)+'</span></div>';
  if(proj){
    html += '<div class="field-row"><div class="field-label">Project</div>'
      +'<div class="field-value" style="color:#4f8ef7">&#128196; '+esc(proj.name)+'</div></div>';
  }
  if(j.client_name||j.location){
    html += '<div class="field-row"><div class="field-label">Client / Location</div>'
      +'<div class="field-value">'+esc(j.client_name||'')+(j.location?' &mdash; '+esc(j.location):'')+'</div></div>';
  }
  if(j.description){
    html += '<div class="field-row"><div class="field-label">Description</div>'
      +'<div class="field-value">'+esc(j.description).replace(/\n/g,'<br>')+'</div></div>';
  }
  var dates=[];
  if(j.start_date) dates.push('Start: '+fmtDate(j.start_date));
  if(j.due_date) dates.push('Due: '+fmtDate(j.due_date));
  if(j.completed_date) dates.push('Completed: '+fmtDate(j.completed_date));
  if(dates.length) html += '<div class="field-row"><div class="field-label">Dates</div><div class="field-value">'+dates.join(' &nbsp;&middot;&nbsp; ')+'</div></div>';
  if(j.notes) html += '<div class="field-row"><div class="field-label">Notes</div><div class="field-value">'+esc(j.notes).replace(/\n/g,'<br>')+'</div></div>';

  html += '<div class="edit-area"><h4>Edit Job</h4>'
    +'<input class="editable-input" id="editTitle" value="'+esc(j.title)+'" placeholder="Title">'
    +'<input class="editable-input" id="editClient" value="'+esc(j.client_name||'')+'" placeholder="Client">'
    +'<input class="editable-input" id="editLocation" value="'+esc(j.location||'')+'" placeholder="Location">'
    +'<input class="editable-input" id="editDue" type="date" value="'+(j.due_date||'')+'">'
    +'<textarea class="editable-input" id="editNotes" rows="3" placeholder="Notes">'+esc(j.notes||'')+'</textarea>'
    +'<div class="btn-row">'
    +'<button class="btn-save" onclick="saveEdits()">Save Changes</button>'
    +'<button class="delete-btn" onclick="confirmDelete()">Delete Job</button>'
    +'</div></div>';
  document.getElementById('panelBody').innerHTML = html;
}
function updateStatus(val){
  fetch('/api/contractor/jobs/'+openJobId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:val})})
    .then(function(){openJobData.status=val;var idx=allJobs.findIndex(function(j){return j.id===openJobId;});if(idx>=0)allJobs[idx].status=val;renderList(allJobs);});
}
function saveEdits(){
  var p={title:document.getElementById('editTitle').value.trim(),client_name:document.getElementById('editClient').value.trim(),location:document.getElementById('editLocation').value.trim(),due_date:document.getElementById('editDue').value||null,notes:document.getElementById('editNotes').value.trim()};
  fetch('/api/contractor/jobs/'+openJobId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
    .then(function(r){return r.json();}).then(function(res){if(res.ok){Object.assign(openJobData,p);var idx=allJobs.findIndex(function(j){return j.id===openJobId;});if(idx>=0)Object.assign(allJobs[idx],p);document.getElementById('panelTitle').textContent=p.title||openJobData.title;renderList(allJobs);flash('Saved &#10003;');}});
}
function confirmDelete(){
  if(!confirm('Delete this work order? All steps, materials and photos will be removed.')) return;
  fetch('/api/contractor/jobs/'+openJobId,{method:'DELETE'}).then(function(){allJobs=allJobs.filter(function(j){return j.id!==openJobId;});renderList(allJobs);closePanel();});
}

// ── Materials ──
function loadMaterials(){
  document.getElementById('panelBody').innerHTML='<div class="spinner">Loading...</div>';
  fetch('/api/contractor/jobs/'+openJobId+'/materials').then(function(r){return r.json();}).then(renderMaterials);
}
function renderMaterials(mats){
  var html='<div class="add-mat-form"><h4>Add Material</h4>'
    +'<div class="form-row"><input class="form-input" id="matName" placeholder="Material name" style="grid-column:1/-1">'
    +'<input class="form-input" id="matQty" type="number" placeholder="Qty" step="0.01">'
    +'<input class="form-input" id="matUnit" placeholder="Unit" value="each">'
    +'<input class="form-input" id="matCost" type="number" placeholder="$/unit" step="0.01"></div>'
    +'<button class="btn-add-mat" onclick="addMaterial()">+ Add Material</button></div>';
  if(mats.length){
    html+=mats.map(function(m){var cost=parseFloat(m.unit_cost||0)*parseFloat(m.qty||0);return '<div class="mat-item" id="mat-'+m.id+'"><div class="mat-info"><div class="mat-name">'+esc(m.material_name)+'</div><div class="mat-detail">'+m.qty+' '+esc(m.unit||'each')+(m.unit_cost?' &middot; $'+parseFloat(m.unit_cost).toFixed(2)+'/unit':'')+'</div></div>'+(cost?'<div class="mat-cost">$'+cost.toFixed(2)+'</div>':'')+'<button class="mat-del" onclick="deleteMaterial(\''+m.id+'\')">&#215;</button></div>';}).join('');
  } else { html+='<div style="text-align:center;padding:24px;color:#475569;font-size:13px;">No materials yet.</div>'; }
  document.getElementById('panelBody').innerHTML=html;
}
function addMaterial(){
  var name=(document.getElementById('matName').value||'').trim();if(!name){alert('Enter a material name');return;}
  fetch('/api/contractor/jobs/'+openJobId+'/materials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({material_name:name,qty:parseFloat(document.getElementById('matQty').value||0),unit:document.getElementById('matUnit').value||'each',unit_cost:parseFloat(document.getElementById('matCost').value||0),added_by:userName})})
    .then(function(r){return r.json();}).then(function(res){if(res.ok)loadMaterials();});
}
function deleteMaterial(id){if(!confirm('Remove material?'))return;fetch('/api/contractor/jobs/'+openJobId+'/materials/'+id,{method:'DELETE'}).then(function(){document.getElementById('mat-'+id).remove();});}

// ── Photos ──
function loadPhotos(){
  document.getElementById('panelBody').innerHTML='<div class="spinner">Loading...</div>';
  fetch('/api/contractor/jobs/'+openJobId+'/photos').then(function(r){return r.json();}).then(renderPhotos);
}
function renderPhotos(photos){
  var html='<div class="photo-upload-area" onclick="document.getElementById(\'photoFileInput\').click()">'
    +'<div style="font-size:32px">&#128247;</div><p>Tap to choose a photo</p>'
    +'<input type="file" id="photoFileInput" accept="image/*" onchange="onPhotoSelected(this)">'
    +'<select class="photo-type-select" id="photoTypeSelect" onclick="event.stopPropagation()"><option value="progress">Progress</option><option value="before">Before</option><option value="after">After</option><option value="other">Other</option></select>'
    +'<input class="photo-caption-input" id="photoCaptionInput" placeholder="Caption (optional)" onclick="event.stopPropagation()">'
    +'<button class="btn-upload-photo" id="uploadPhotoBtn" onclick="event.stopPropagation();uploadPhoto()">Upload Photo</button></div>';
  if(photos.length){
    html+='<div class="photo-grid">'+photos.map(function(p){var tc={'before':'pt-before','progress':'pt-progress','after':'pt-after','other':'pt-other'}[p.photo_type]||'pt-other';return '<div class="photo-card"><img class="photo-thumb" src="/api/contractor/jobs/'+openJobId+'/photos/'+p.id+'/img" onclick="openLightboxId(\''+p.id+'\')" loading="lazy" onerror="this.parentElement.style.display=\'none\'"><div class="photo-foot"><span class="photo-type-lbl '+tc+'">'+ucfirst(p.photo_type||'other')+'</span><span class="photo-caption-txt">'+esc(p.caption||'')+'</span><button class="photo-del" onclick="deletePhoto(\''+p.id+'\')">&#215;</button></div></div>';}).join('')+'</div>';
  } else { html+='<div style="text-align:center;padding:24px;color:#475569;font-size:13px;">No photos yet.</div>'; }
  document.getElementById('panelBody').innerHTML=html;
}
function onPhotoSelected(input){if(input.files&&input.files[0]){selectedPhotoFile=input.files[0];document.getElementById('uploadPhotoBtn').classList.add('visible');}}
function uploadPhoto(){
  if(!selectedPhotoFile){alert('No file selected');return;}
  var reader=new FileReader();
  reader.onload=function(e){fetch('/api/contractor/jobs/'+openJobId+'/photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo_data:e.target.result,photo_type:document.getElementById('photoTypeSelect').value,caption:(document.getElementById('photoCaptionInput').value||'').trim(),uploaded_by:userName})}).then(function(r){return r.json();}).then(function(res){if(res.ok){selectedPhotoFile=null;loadPhotos();}else alert('Upload error: '+res.error);});};
  reader.readAsDataURL(selectedPhotoFile);
}
function deletePhoto(id){if(!confirm('Remove photo?'))return;fetch('/api/contractor/jobs/'+openJobId+'/photos/'+id,{method:'DELETE'}).then(function(){loadPhotos();});}
function openLightboxId(id){fetch('/api/contractor/jobs/'+openJobId+'/photos/'+id).then(function(r){return r.json();}).then(function(d){document.getElementById('lightboxImg').src=d.photo_data||'';document.getElementById('lightbox').classList.add('open');});}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lightboxImg').src='';}

// ── Create modal ──
var createStepCount = 5;
function populateProjectSelect(){
  var sel=document.getElementById('newProject');
  allProjects.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);});
}
function initCreateSteps(){
  var c=document.getElementById('stepFieldsContainer');
  c.innerHTML='';
  createStepCount=0;
  DEFAULT_STEPS.forEach(function(name){addStepField(name);});
  updateAddStepBtn();
}
function addStepField(defaultName){
  if(createStepCount>=10){alert('Maximum 10 steps.');return;}
  createStepCount++;
  var num=createStepCount;
  var c=document.getElementById('stepFieldsContainer');
  var row=document.createElement('div');
  row.className='step-field-row';
  row.id='sfrow-'+num;
  row.innerHTML='<div class="step-field-num">'+num+'</div>'
    +'<input class="step-field-input" value="'+(defaultName?esc(defaultName):'')+'" placeholder="Step '+num+' name">'
    +(num>5?'<button class="step-field-del" onclick="removeStepField('+num+')">&#215;</button>':'');
  c.appendChild(row);
  updateAddStepBtn();
}
function removeStepField(num){
  var row=document.getElementById('sfrow-'+num);
  if(row) row.remove();
  createStepCount--;
  // Re-number
  var rows=document.querySelectorAll('#stepFieldsContainer .step-field-row');
  rows.forEach(function(r,i){r.querySelector('.step-field-num').textContent=i+1;});
  updateAddStepBtn();
}
function updateAddStepBtn(){
  var btn=document.getElementById('addStepFieldBtn');
  if(createStepCount>=10){btn.disabled=true;btn.textContent='Max 10 steps';}
  else{btn.disabled=false;btn.textContent='+ Add Step';}
}
function openCreate(){
  document.getElementById('createModal').classList.add('open');
  document.getElementById('newStart').value=new Date().toISOString().split('T')[0];
  initCreateSteps();
}
function closeCreate(){document.getElementById('createModal').classList.remove('open');}
function submitNewJob(){
  var title=document.getElementById('newTitle').value.trim();
  if(!title){alert('Job title is required');return;}
  var stepNames=[];
  document.querySelectorAll('#stepFieldsContainer .step-field-input').forEach(function(inp){
    if(inp.value.trim()) stepNames.push(inp.value.trim());
  });
  var payload={
    title:title,description:document.getElementById('newDesc').value.trim(),
    client_name:document.getElementById('newClient').value.trim(),
    location:document.getElementById('newLocation').value.trim(),
    priority:document.getElementById('newPriority').value,
    status:document.getElementById('newStatus').value,
    start_date:document.getElementById('newStart').value||null,
    due_date:document.getElementById('newDue').value||null,
    notes:document.getElementById('newNotes').value.trim(),
    created_by:userName,
    project_id:document.getElementById('newProject').value||null
  };
  fetch('/api/contractor/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res.ok){alert('Error: '+res.error);return;}
      var newJob=res.job;
      // Create steps
      return fetch('/api/contractor/jobs/'+newJob.id+'/steps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps:stepNames})})
        .then(function(){
          allJobs.unshift(newJob);
          renderList(allJobs);
          closeCreate();
          ['newTitle','newDesc','newClient','newLocation','newNotes'].forEach(function(id){document.getElementById(id).value='';});
          document.getElementById('newPriority').value='normal';
          document.getElementById('newStatus').value='open';
          document.getElementById('newProject').value='';
        });
    });
}

// ── Helpers ──
function statusLabel(s){return {open:'Open',in_progress:'In Progress',on_hold:'On Hold',completed:'Completed',cancelled:'Cancelled'}[s]||s;}
function ucfirst(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function fmtDate(d){if(!d)return'';var p=d.split('-');return p[1]+'/'+p[2]+'/'+p[0].slice(2);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function flash(msg){var el=document.createElement('div');el.innerHTML=msg;el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e9484;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s;';document.body.appendChild(el);setTimeout(function(){el.style.opacity='1';},10);setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove();},300);},1800);}

document.getElementById('createModal').addEventListener('click',function(e){if(e.target===this)closeCreate();});
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
</script>
