<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermaniland - Football Draft Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .section { display: none; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .section.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1em; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 1em; cursor: pointer; font-weight: 600; transition: transform 0.2s; margin-right: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .two-column { grid-template-columns: 1fr; } }
        .room-code-display { background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .room-code-display .code { font-size: 2em; font-weight: bold; color: #667eea; font-family: 'Courier New', monospace; letter-spacing: 3px; }
        .player-list { background: #f9f9f9; border-radius: 8px; padding: 15px; margin: 20px 0; }
        .player-item { padding: 10px; margin: 8px 0; background: white; border-left: 4px solid #667eea; border-radius: 4px; }
        .timer { font-size: 4em; font-weight: bold; text-align: center; color: #667eea; margin: 20px 0; }
        .timer.warning { color: #ff9800; }
        .timer.danger { color: #f44336; }
        .player-card { background: #f5f5f5; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #667eea; cursor: pointer; transition: all 0.2s; font-size: 0.9em; }
        .player-card:hover:not(.drafted) { background: #efefef; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15); }
        .player-card.selected { background: #e8eaf6; font-weight: 600; }
        .player-card.drafted { opacity: 0.4; cursor: not-allowed; background: #f0f0f0; }
        .player-name { font-weight: 600; font-size: 0.95em; margin-bottom: 4px; }
        .player-meta { font-size: 0.8em; color: #666; margin-bottom: 6px; }
        .player-stats { display: flex; gap: 8px; font-size: 0.75em; justify-content: flex-start; flex-wrap: wrap; }
        .stat { background: white; padding: 2px 6px; border-radius: 3px; text-align: center; white-space: nowrap; }
        .stat-label { font-weight: 600; color: #666; font-size: 0.7em; }
        .stat-value { color: #667eea; font-weight: bold; margin-left: 2px; }
        .stat { display: inline-flex; flex-direction: column; align-items: center; }
        .teams-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .teams-table th { background: #667eea; color: white; padding: 12px; text-align: left; }
        .teams-table td { padding: 10px; border-bottom: 1px solid #e0e0e0; }
        .teams-table tr:hover { background: #f5f5f5; }
        .leaderboard { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .leaderboard th { background: #667eea; color: white; padding: 12px; text-align: left; }
        .leaderboard td { padding: 12px; border-bottom: 1px solid #e0e0e0; }
        .leaderboard tr:hover { background: #f5f5f5; }
        .medal { font-size: 1.5em; margin-right: 5px; }
        .result-winner { background: #fff3e0; border: 2px solid #ff9800; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .result-winner h2 { color: #ff9800; margin: 10px 0; }
        .copy-btn { background: #4CAF50; margin-left: 10px; padding: 8px 16px; font-size: 0.9em; }
        .draft-controls { display: flex; gap: 10px; margin-top: 20px; }
        .draft-controls button { flex: 1; }
        .current-info { background: #e8eaf6; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ HERMANILAND</h1>
            <p>Football Draft Game</p>
        </header>

        <!-- CREATE ROOM SECTION -->
        <div id="createSection" class="section active">
            <h2>Create a New Game</h2>
            <div class="two-column">
                <div>
                    <div class="form-group">
                        <label>Your Name (Admin)</label>
                        <input type="text" id="adminName" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label>Your Team Name</label>
                        <input type="text" id="teamName1" placeholder="Enter team name">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>Number of Players</label>
                        <select id="numPlayers">
                            <option value="1">1 Player (+ AI)</option>
                            <option value="2">2 Players</option>
                            <option value="3">3 Players</option>
                            <option value="4" selected>4 Players</option>
                            <option value="6">6 Players</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>AI Difficulty</label>
                        <select id="aiDifficulty">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                            <option value="legend">Legend</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="two-column">
                <div>
                    <div class="form-group">
                        <label>Tournament Mode</label>
                        <select id="tournamentMode">
                            <option value="round_robin">Round Robin (All vs All)</option>
                            <option value="knockout">Knockout (Brackets)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>Time per Pick (seconds)</label>
                        <select id="timePerPick">
                            <option value="30">30 seconds</option>
                            <option value="45">45 seconds</option>
                            <option value="60">1 minute</option>
                            <option value="90">1.5 minutes</option>
                            <option value="120" selected>2 minutes</option>
                            <option value="180">3 minutes</option>
                            <option value="240">4 minutes</option>
                            <option value="300">5 minutes</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="createRoom()" style="width: 100%; margin-top: 20px;">Create Room</button>
        </div>

        <!-- JOIN ROOM SECTION -->
        <div id="joinSection" class="section">
            <h2>Join a Game</h2>
            <div class="two-column">
                <div>
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="playerName" placeholder="Enter your name">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>Room Code</label>
                        <input type="text" id="roomCodeInput" placeholder="e.g., ABC1" maxlength="4">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Your Team Name</label>
                <input type="text" id="teamNameJoin" placeholder="Enter your team name">
            </div>

            <button onclick="joinRoom()" style="width: 100%;">Join Room</button>
        </div>

        <!-- LOBBY SECTION -->
        <div id="lobbySection" class="section">
            <h2>Game Lobby</h2>

            <div class="room-code-display">
                <h3>ROOM CODE</h3>
                <div class="code" id="displayCode">----</div>
                <button class="copy-btn" onclick="copyRoomURL()">📋 Copy URL</button>
            </div>

            <h3 style="margin-top: 30px;">Participants</h3>
            <div class="player-list" id="participantsList"></div>

            <button id="startDraftBtn" onclick="startDraft()" style="width: 100%; margin-top: 20px; display: none;">Start Draft</button>
        </div>

        <!-- DRAFT SECTION -->
        <div id="draftSection" class="section">
            <h2>Player Draft</h2>

            <!-- LIVE TEAMS TABLE -->
            <h3>Live Teams</h3>
            <div style="overflow-x: auto;">
                <table class="teams-table" id="teamsTable">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>Players Selected</th>
                            <th>Coach</th>
                            <th>Formation</th>
                        </tr>
                    </thead>
                    <tbody id="teamsTableBody"></tbody>
                </table>
            </div>

            <div class="current-info" id="currentPickInfo">
                <span id="currentPickText">Waiting for draft to start...</span>
            </div>

            <div class="timer" id="timer">20</div>

            <div class="draft-controls">
                <button id="addToTeamBtn" onclick="addPlayerToTeam()" disabled>✓ Add to My Team</button>
                <button onclick="skipPick()" id="skipBtn">Skip / Next Player</button>
            </div>

            <h3>Your Selected Players</h3>
            <div id="selectedPlayersList" class="player-list"></div>

            <div style="margin-bottom: 20px; margin-top: 30px;">
                <input type="text" id="playerSearch" placeholder="Search player..." onkeyup="searchPlayers()">
            </div>

            <div id="playersList" style="max-height: 350px; overflow-y: auto; margin-bottom: 20px;"></div>
        </div>

        <!-- FORMATION SECTION -->
        <div id="formationSection" class="section">
            <h2>Select Formation & Coach</h2>

            <div class="form-group">
                <label>Formation</label>
                <select id="formationSelect">
                    <option value="4-3-3">4-3-3 (Classic Balanced)</option>
                    <option value="4-2-4">4-2-4 (Defensive Midfield)</option>
                    <option value="3-5-2">3-5-2 (Wing-Heavy)</option>
                    <option value="5-3-2">5-3-2 (Defensive)</option>
                    <option value="4-4-2">4-4-2 (Classic)</option>
                    <option value="3-4-3">3-4-3 (Attacking)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Coach / Manager</label>
                <select id="coachSelect"></select>
            </div>

            <button onclick="confirmFormation()" style="width: 100%;">Confirm Formation</button>
        </div>

        <!-- RESULTS SECTION -->
        <div id="resultsSection" class="section">
            <h2>Final Results</h2>

            <div class="result-winner" id="winnerDisplay"></div>

            <h3>Leaderboard</h3>
            <table class="leaderboard" id="leaderboard"></table>
        </div>
    </div>

    <script>
        let gameState = {
            roomCode: null,
            playerId: null,
            players: [],
            coaches: [],
            formations: [],
            selectedPlayers: [],
            selectedPlayer: null,
            timerInterval: null,
            draftedPlayers: new Set(),
            timePerPick: 20,
            participants: {}
        };

        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) {
                document.getElementById('roomCodeInput').value = room;
                showSection('joinSection');
            }
            loadGameData();
        });

        function loadGameData() {
            fetch('/api/hermaniland/coaches')
                .then(r => r.json())
                .then(data => {
                    gameState.coaches = data.coaches;
                    populateCoaches();
                });

            fetch('/api/hermaniland/formations')
                .then(r => r.json())
                .then(data => gameState.formations = data.formations);
        }

        function loadPlayers() {
            if (gameState.players.length > 0) return Promise.resolve();
            return fetch('/api/hermaniland/players')
                .then(r => r.json())
                .then(data => {
                    gameState.players = data.players;
                    console.log('Loaded ' + gameState.players.length + ' players');
                })
                .catch(e => {
                    console.error('Error loading players:', e);
                    alert('Error loading players: ' + e.message);
                });
        }

        function populateCoaches() {
            const select = document.getElementById('coachSelect');
            select.innerHTML = '';
            gameState.coaches.forEach(coach => {
                const option = document.createElement('option');
                option.value = coach.name;
                option.textContent = `${coach.name} (Atk: ${coach.attack}, Def: ${coach.defense})`;
                select.appendChild(option);
            });
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function createRoom() {
            const data = {
                admin_name: document.getElementById('adminName').value,
                team_name: document.getElementById('teamName1').value,
                num_players: document.getElementById('numPlayers').value,
                ai_difficulty: document.getElementById('aiDifficulty').value,
                tournament_mode: document.getElementById('tournamentMode').value,
                time_per_pick: document.getElementById('timePerPick').value
            };

            fetch('/api/hermaniland/create-room', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(data => {
                gameState.roomCode = data.room_code;
                gameState.playerId = data.admin_id;
                document.getElementById('displayCode').textContent = gameState.roomCode;
                updateLobby();
                showSection('lobbySection');
            });
        }

        function joinRoom() {
            const data = {
                room_code: document.getElementById('roomCodeInput').value,
                player_name: document.getElementById('playerName').value,
                team_name: document.getElementById('teamNameJoin').value
            };

            fetch('/api/hermaniland/join-room', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(r => {
                if (!r.ok) throw new Error('Failed to join');
                return r.json();
            })
            .then(data => {
                gameState.roomCode = document.getElementById('roomCodeInput').value.toUpperCase();
                gameState.playerId = data.player_id;
                document.getElementById('displayCode').textContent = gameState.roomCode;
                updateLobby();
                showSection('lobbySection');
            })
            .catch(e => alert('Could not join room: ' + e.message));
        }

        function updateLobby() {
            fetch(`/api/hermaniland/room/${gameState.roomCode}`)
                .then(r => r.json())
                .then(room => {
                    gameState.timePerPick = room.time_per_pick;
                    gameState.participants = room.participants;

                    const list = document.getElementById('participantsList');
                    list.innerHTML = '';

                    Object.entries(room.participants).forEach(([id, p]) => {
                        const div = document.createElement('div');
                        div.className = 'player-item';
                        div.innerHTML = `<strong>${p.name}</strong> - ${p.team_name}${p.is_admin ? ' (Admin)' : ''}`;
                        list.appendChild(div);
                    });

                    const startBtn = document.getElementById('startDraftBtn');
                    const adminId = Object.entries(room.participants).find(([_, p]) => p.is_admin)?.[0];
                    if (gameState.playerId === adminId && room.status === 'waiting') {
                        startBtn.style.display = 'block';
                    }

                    if (room.status === 'waiting') {
                        setTimeout(updateLobby, 2000);
                    }
                });
        }

        function copyRoomURL() {
            const url = `${window.location.origin}/hermaniland?room=${gameState.roomCode}`;
            navigator.clipboard.writeText(url);
            alert('Room URL copied!');
        }

        function startDraft() {
            loadPlayers().then(() => {
                fetch(`/api/hermaniland/start-draft/${gameState.roomCode}`, {method: 'POST'})
                    .then(r => r.json())
                    .then(data => {
                        gameState.draftedPlayers = new Set();
                        showSection('draftSection');
                        displayPlayers();
                        updateTeamsTable().then(() => {
                            startPickTimer();
                            pollDraftStatus();
                        }).catch(e => console.error('Error updating teams table:', e));
                    })
                    .catch(e => {
                        console.error('Error starting draft:', e);
                        alert('Error starting draft: ' + e.message);
                    });
            }).catch(e => {
                console.error('Error loading players before draft:', e);
                alert('Error loading players: ' + e.message);
            });
        }

        function getTeamColor(teamName) {
            // Generate consistent color from team name hash
            if (!teamName) return '#667eea';
            let hash = 0;
            for (let i = 0; i < teamName.length; i++) {
                hash = ((hash << 5) - hash) + teamName.charCodeAt(i);
                hash = hash & hash;
            }
            const colors = ['#667eea', '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739'];
            return colors[Math.abs(hash) % colors.length];
        }

        function formatPlayerNames(players) {
            // Convert array of player objects to "LastName I., LastName I." format
            if (!players || players.length === 0) return '';
            return players.map(p => {
                const parts = p.name.split(' ');
                if (parts.length >= 2) {
                    const lastName = parts[parts.length - 1];
                    const firstInitial = parts[0][0].toUpperCase();
                    return `${lastName} ${firstInitial}.`;
                }
                return p.name;
            }).join(', ');
        }

        function displayPlayers() {
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            if (!gameState.players || gameState.players.length === 0) {
                list.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No players available</div>';
                console.warn('No players to display');
                return;
            }
            gameState.players.forEach(player => {
                const isDrafted = gameState.draftedPlayers.has(player.name);
                const div = document.createElement('div');
                const teamColor = getTeamColor(player.team);
                div.className = `player-card ${isDrafted ? 'drafted' : ''}`;
                div.style.borderLeftColor = teamColor;
                div.innerHTML = `
                    <div class="player-name">${player.name}</div>
                    <div class="player-meta"><span style="background: ${teamColor}; color: white; padding: 1px 6px; border-radius: 3px; font-size: 0.75em;">${player.team || 'Unknown'}</span> • ${player.position}</div>
                    <div class="player-stats">
                        <div class="stat"><span class="stat-label">Spd</span><span class="stat-value">${player.speed}</span></div>
                        <div class="stat"><span class="stat-label">Drb</span><span class="stat-value">${player.dribbling}</span></div>
                        <div class="stat"><span class="stat-label">Sht</span><span class="stat-value">${player.shooting}</span></div>
                        <div class="stat"><span class="stat-label">Def</span><span class="stat-value">${player.defense}</span></div>
                    </div>
                `;
                if (!isDrafted) {
                    div.onclick = () => selectPlayerForDraft(player);
                }
                list.appendChild(div);
            });
            console.log('Displayed ' + gameState.players.length + ' players');
        }

        function selectPlayerForDraft(player) {
            if (gameState.currentPickerId !== gameState.playerId) {
                alert('Not your turn! Waiting for ' + (gameState.currentPickerName || 'next player'));
                return;
            }
            gameState.selectedPlayer = player;
            document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            document.getElementById('addToTeamBtn').disabled = false;
        }

        function addPlayerToTeam() {
            if (!gameState.selectedPlayer) return;
            if (gameState.currentPickerId !== gameState.playerId) {
                alert('Not your turn!');
                return;
            }

            fetch(`/api/hermaniland/draft-player/${gameState.roomCode}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player_name: gameState.selectedPlayer.name,
                    player_id: gameState.playerId
                })
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success && data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                gameState.selectedPlayers.push(gameState.selectedPlayer);
                gameState.draftedPlayers.add(gameState.selectedPlayer.name);
                updateSelectedList();
                displayPlayers();
                gameState.selectedPlayer = null;
                document.getElementById('addToTeamBtn').disabled = true;

                if (data.draft_complete) {
                    clearInterval(gameState.timerInterval);
                    alert('Draft complete! Proceeding to formation selection...');
                    showSection('formationSection');
                } else {
                    // Auto-advance to next player after 500ms
                    setTimeout(() => skipPick(), 500);
                }
            });
        }

        function skipPick() {
            fetch(`/api/hermaniland/next-pick/${gameState.roomCode}`, {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    updateTeamsTable();
                    startPickTimer();
                });
        }

        function updateSelectedList() {
            const selected = document.getElementById('selectedPlayersList');
            selected.innerHTML = '';
            gameState.selectedPlayers.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'player-item';
                div.textContent = `${i + 1}. ${p.name} (${p.position})`;
                selected.appendChild(div);
            });
        }

        function updateTeamsTable() {
            return fetch(`/api/hermaniland/room/${gameState.roomCode}`)
                .then(r => r.json())
                .then(room => {
                    gameState.timePerPick = room.time_per_pick;
                    gameState.currentPickerId = room.pick_order[room.current_pick_index];
                    const tbody = document.getElementById('teamsTableBody');
                    tbody.innerHTML = '';

                    Object.entries(room.participants).forEach(([_, p]) => {
                        const row = document.createElement('tr');
                        const playersList = formatPlayerNames(p.players);
                        const isCurrentPicker = _ === gameState.currentPickerId;
                        row.innerHTML = `
                            <td><strong>${p.team_name}</strong> ${isCurrentPicker ? '🎯' : ''}</td>
                            <td>${playersList || '(none yet)'}</td>
                            <td>${p.coach || '-'}</td>
                            <td>${p.formation || '-'}</td>
                        `;
                        tbody.appendChild(row);
                    });

                    const currentPickerId = gameState.currentPickerId;
                    const currentPlayer = room.participants[currentPickerId];
                    document.getElementById('currentPickText').textContent = `🎯 ${currentPlayer.name} is picking... (Round ${room.current_round})`;
                });
        }

        function startPickTimer() {
            clearInterval(gameState.timerInterval);
            let seconds = gameState.timePerPick;
            document.getElementById('timer').textContent = seconds;
            document.getElementById('timer').classList.remove('warning', 'danger');

            gameState.timerInterval = setInterval(() => {
                seconds--;
                document.getElementById('timer').textContent = seconds;

                if (seconds <= 5) document.getElementById('timer').classList.add('danger');
                else if (seconds <= 10) document.getElementById('timer').classList.add('warning');

                if (seconds <= 0) {
                    clearInterval(gameState.timerInterval);
                    skipPick();
                }
            }, 1000);
        }

        function pollDraftStatus() {
            const poll = setInterval(() => {
                fetch(`/api/hermaniland/room/${gameState.roomCode}`)
                    .then(r => r.json())
                    .then(room => {
                        if (room.status !== 'drafting') {
                            clearInterval(poll);
                        } else {
                            gameState.draftedPlayers = new Set(room.drafted_players);
                            displayPlayers();
                            updateTeamsTable();
                        }
                    });
            }, 2000);
        }

        let searchTimeout;
        function normalizeText(text) {
            return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        }
        function searchPlayers() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('playerSearch').value.trim();
            if (!query) {
                document.querySelectorAll('.player-card').forEach(card => card.style.display = 'block');
                return;
            }
            const normalizedQuery = normalizeText(query);
            const queryTerms = normalizedQuery.split(/\s+/);

            searchTimeout = setTimeout(() => {
                document.querySelectorAll('.player-card').forEach(card => {
                    const name = normalizeText(card.textContent);
                    const position = card.querySelector('.player-meta')?.textContent.toLowerCase() || '';
                    const team = card.querySelector('.player-meta')?.textContent.toLowerCase() || '';

                    let matchScore = 0;
                    queryTerms.forEach(term => {
                        if (name.includes(term)) {
                            if (name.startsWith(term)) matchScore += 3;
                            else if (name.split(' ').some(w => w.startsWith(term))) matchScore += 2;
                            else matchScore += 1;
                        }
                        if (position.includes(term)) matchScore += 0.5;
                        if (team.includes(term)) matchScore += 0.5;
                    });

                    card.style.display = matchScore > 0 ? 'block' : 'none';
                });
            }, 300);
        }

        function confirmFormation() {
            const formation = document.getElementById('formationSelect').value;
            const coach = document.getElementById('coachSelect').value;

            fetch(`/api/hermaniland/select-formation/${gameState.roomCode}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({player_id: gameState.playerId, formation, coach_name: coach})
            })
            .then(r => r.json())
            .then(data => {
                if (data.all_ready) {
                    setTimeout(() => {
                        fetch(`/api/hermaniland/results/${gameState.roomCode}`)
                            .then(r => r.json())
                            .then(data => displayResults(data));
                    }, 2000);
                }
            });
        }

        function displayResults(data) {
            const winner = data.results[0];
            const winnerDiv = document.getElementById('winnerDisplay');
            winnerDiv.innerHTML = `
                <h2>🎉 WINNER: ${winner.name}</h2>
                <p><strong>${winner.team_name}</strong></p>
                <p>Formation: ${winner.formation}</p>
                <p>Goals: ${winner.goals}</p>
            `;

            const table = document.getElementById('leaderboard');
            table.innerHTML = '<tr><th>Pos</th><th>Team</th><th>Goals</th><th>Formation</th></tr>';

            data.results.forEach((r, i) => {
                const medals = ['🥇', '🥈', '🥉'];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${medals[i] || (i+1)}</td>
                    <td><strong>${r.name}</strong><br><small>${r.team_name}</small></td>
                    <td><strong>${r.goals}</strong></td>
                    <td>${r.formation}</td>
                `;
                table.appendChild(row);
            });

            showSection('resultsSection');
        }
    </script>
</body>
</html>
