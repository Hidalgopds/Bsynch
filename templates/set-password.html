<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Choose your password – BSynch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#0f172a;min-height:100vh}
header{background:#19354d;color:#e2e8f0;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#0f766e,#4f8ef7);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.lang{margin-left:auto;display:flex;gap:6px}
.lang button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#e2e8f0;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:#e2e8f0;color:#19354d}
main{max-width:420px;margin:0 auto;padding:32px 16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:21px}
p{color:#566275;font-size:14px;line-height:1.5}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:#334155}
input{padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;font-family:inherit}
input:focus{outline:2px solid #0f766e;outline-offset:1px}
button.go{background:#0f766e;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}
button.go:disabled{opacity:.6}
.msg{font-size:14px;min-height:18px;color:#b91c1c}
a{color:#0f766e;font-weight:700}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">B</div><b>BSynch</b>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
</header>
<main>
  {% if valid %}
  <form class="card" id="f">
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
    <label><span data-t="pw1"></span><input type="password" id="pw1" minlength="8" autocomplete="new-password" required></label>
    <label><span data-t="pw2"></span><input type="password" id="pw2" minlength="8" autocomplete="new-password" required></label>
    <button class="go" id="go" type="submit" data-t="save"></button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <div class="card" id="done" hidden><h1 data-t="doneTitle"></h1><p data-t="doneText"></p><a href="/login" data-t="signIn"></a></div>
  {% else %}
  <div class="card"><h1 data-t="badTitle"></h1><p data-t="badText"></p><a href="/login" data-t="signIn"></a></div>
  {% endif %}
</main>
<script>
var TOKEN = {{ token|tojson }}, lang = {{ lang|tojson }};
var T = {
  en: {title: 'Choose your password', intro: 'Use at least 8 characters. This link works only once.', pw1: 'New password', pw2: 'Repeat it',
       save: 'Save password', doneTitle: 'Password saved ✓', doneText: 'Now sign in with your email and your new password.', signIn: 'Go to sign in',
       badTitle: 'This link no longer works', badText: 'It was already used or it expired. On the sign-in page, use "Forgot password?" to get a new one.',
       short: 'Use at least 8 characters.', diff: 'The two passwords are different.', conn: 'Connection error. Try again.'},
  es: {title: 'Elige tu contraseña', intro: 'Usa al menos 8 caracteres. Este enlace sirve una sola vez.', pw1: 'Contraseña nueva', pw2: 'Repítela',
       save: 'Guardar contraseña', doneTitle: 'Contraseña guardada ✓', doneText: 'Ahora inicia sesión con tu correo y tu contraseña nueva.', signIn: 'Ir a iniciar sesión',
       badTitle: 'Este enlace ya no sirve', badText: 'Ya se usó o venció. En la página de inicio de sesión usa "Forgot password?" para pedir uno nuevo.',
       short: 'Usa al menos 8 caracteres.', diff: 'Las dos contraseñas no son iguales.', conn: 'Error de conexión. Intenta de nuevo.'}
};
function apply(l){
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = T[l][el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.l === l ? 'true' : 'false'); });
}
document.querySelectorAll('.lang button').forEach(function(b){ b.onclick = function(){ apply(b.dataset.l); }; });
apply(lang);
var f = document.getElementById('f');
if(f) f.onsubmit = function(e){
  e.preventDefault();
  var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value, m = document.getElementById('msg'), go = document.getElementById('go');
  if(a.length < 8){ m.textContent = T[lang].short; return; }
  if(a !== b){ m.textContent = T[lang].diff; return; }
  go.disabled = true; m.textContent = '';
  fetch('/api/public/set-password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: TOKEN, password: a, lang: lang})})
    .then(function(r){ return r.json(); }).then(function(d){
      go.disabled = false;
      if(!d.ok){ m.textContent = d.error || T[lang].conn; return; }
      f.hidden = true; document.getElementById('done').hidden = false;
    }).catch(function(){ go.disabled = false; m.textContent = T[lang].conn; });
};
</script>
</body>
</html>
