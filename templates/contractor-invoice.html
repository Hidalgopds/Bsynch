<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice – BSynch</title>
<script>window.CT_SKIP_AGREEMENT = true;</script>
<script src="/static/contractor-scope.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1b36;--gold:#e8a317;--muted:#6b7280;--line:#e5e7eb;}
body{font-family:Arial,Helvetica,sans-serif;background:#e5e7eb;color:#111827;}
.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;background:#111827;}
.toolbar button,.toolbar a{padding:9px 16px;border-radius:8px;border:none;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;font-family:'Segoe UI',system-ui,sans-serif;}
.b-print{background:#1e9484;color:#fff;}
.b-sec{background:#374151;color:#e5e7eb;}
.sheet{position:relative;width:8.5in;min-height:11in;margin:24px auto;background:#fff;padding:.55in .6in .5in;box-shadow:0 4px 24px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;}
@media(max-width:860px){.sheet{width:100%;min-height:0;margin:0;padding:24px 18px;}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
.logo{max-width:2.6in;max-height:1.15in;object-fit:contain;}
.logo-text{font-size:26px;font-weight:800;color:var(--navy);}
.title{text-align:right;}
.title h1{font-size:40px;letter-spacing:1px;color:var(--navy);font-weight:800;line-height:1;}
.title .tag{font-style:italic;color:var(--gold);font-size:12px;margin-top:6px;}
.mid{display:flex;justify-content:space-between;gap:20px;margin-top:22px;}
.parties{display:flex;gap:36px;padding-top:10px;}
.lbl{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;}
.party b{display:block;font-size:13px;color:var(--navy);margin-bottom:3px;}
.party .lines{font-size:11.5px;color:var(--muted);line-height:1.5;white-space:pre-line;}
.party .site{font-size:12px;color:#111827;}
.meta{background:#f3f4f8;border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;min-width:3.1in;align-self:flex-start;}
.meta span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.meta b{font-size:12.5px;color:var(--navy);}
.meta .plain{font-weight:400;color:#111827;}
table{width:100%;border-collapse:collapse;margin-top:34px;}
thead th{background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;text-align:left;}
th.n,td.n{text-align:right;white-space:nowrap;}
th.c,td.c{text-align:center;}
tbody td{font-size:12px;padding:12px 10px;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.5;}
tbody td.desc{white-space:pre-line;}
.totals{margin-left:auto;width:3.4in;margin-top:16px;}
.sub-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:8px 10px;}
.due{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:5px;padding:12px 12px;margin-top:8px;}
.due span{font-size:12.5px;font-weight:700;}
.due b{font-size:20px;color:var(--gold);}
.pay{margin-top:34px;border-left:3px solid var(--gold);padding:4px 0 4px 10px;max-width:5in;}
.pay .t{font-size:10.5px;font-weight:700;color:var(--navy);margin-bottom:4px;text-transform:uppercase;}
.pay p{font-size:11.5px;color:var(--muted);line-height:1.5;}
.watermark{position:absolute;right:.55in;bottom:1.5in;width:3.6in;opacity:.08;pointer-events:none;}
.spacer{flex:1;min-height:40px;}
.thanks{text-align:center;font-weight:700;font-size:13px;color:var(--navy);}
.rule{width:80px;height:1px;background:var(--muted);margin:8px auto;}
.foot{text-align:center;font-size:10px;color:var(--muted);}
.msg{text-align:center;padding:80px 20px;color:var(--muted);font-family:'Segoe UI',system-ui,sans-serif;}
@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .sheet{margin:0;box-shadow:none;width:auto;min-height:10.4in;padding:0;}
  @page{size:letter;margin:.5in .55in;}
  thead th,.due,.meta{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="toolbar">
  <button class="b-sec" onclick="history.back()">&#8592; Back</button>
  <button class="b-print" onclick="window.print()">&#128424; Print / Save PDF</button>
  <a class="b-sec" id="mailBtn" href="#">&#9993; Email</a>
</div>
<div class="sheet" id="sheet"><div class="msg">Loading&hellip;</div></div>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return '$' + (parseFloat(n) || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function qty(n){ n = parseFloat(n) || 0; return n % 1 ? n.toFixed(2) : String(n); }
function safeImg(u){ return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(u || '') || /^\/static\/brand\/[\w.-]+\.(png|jpg|webp)$/.test(u || '') ? u : ''; }
function safeColor(c, d){ return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : d; }
function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) + '/' + p[0] : d; }

fetch('/api/contractor/invoices/' + encodeURIComponent({{ invoice_id|tojson }})).then(function(r){ return r.json(); }).then(function(d){
  var sheet = document.getElementById('sheet');
  if(!d.ok){ sheet.innerHTML = '<div class="msg">' + (d.error === 'not found' ? 'Invoice not found.' : 'You do not have access to this invoice.') + '</div>'; return; }
  var inv = d.invoice, co = inv.company_snapshot || {}, logo = safeImg(co.logo);
  document.documentElement.style.setProperty('--navy', safeColor(co.brand_primary, '#0d1b36'));
  document.documentElement.style.setProperty('--gold', safeColor(co.brand_accent, '#e8a317'));
  var emails = co.emails || [], email = emails[0] || '';
  var addr = (co.address || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var city = addr.length > 1 ? addr[addr.length - 1] : (addr[0] || '');
  var fromLines = addr.concat([co.phone || '', email]).filter(Boolean).join('\n');
  var footer = [co.display_name, co.subtitle, city, co.phone, email].filter(Boolean).map(esc).join('&nbsp; | &nbsp;');
  var rows = (inv.items || []).map(function(it){
    return '<tr><td class="desc">' + esc(it.description) + '</td><td class="c">' + esc(qty(it.qty)) + '</td><td class="n">' + money(it.amount) + '</td><td class="n">' + money(it.total) + '</td></tr>';
  }).join('');
  sheet.innerHTML =
    '<div class="top"><div>' + (logo ? '<img class="logo" alt="" src="' + logo + '">' : '<div class="logo-text">' + esc(co.display_name) + '</div>') + '</div>' +
      '<div class="title"><h1>INVOICE</h1>' + (co.tagline ? '<div class="tag">"' + esc(co.tagline) + '"</div>' : '') + '</div></div>' +
    '<div class="mid"><div class="parties">' +
        '<div class="party"><div class="lbl">From</div><b>' + esc(co.display_name) + '</b><div class="lines">' + esc(fromLines) + '</div></div>' +
        '<div class="party"><div class="lbl">Bill to</div><b>' + esc(inv.bill_to || '-') + '</b>' +
          (inv.job_site ? '<div class="lbl" style="margin-top:12px;">Job site</div><div class="site">' + esc(inv.job_site) + '</div>' : '') + '</div>' +
      '</div>' +
      '<div class="meta">' +
        '<div><span>Invoice no.</span><b>' + esc(inv.invoice_number) + '</b></div>' +
        '<div><span>Date</span><b class="plain">' + esc(fmtDate(inv.invoice_date)) + '</b></div>' +
        '<div><span>Customer ID</span><b class="plain">' + esc(inv.customer_id || '-') + '</b></div>' +
        '<div><span>Payment terms</span><b>' + esc(inv.payment_terms || '-') + '</b></div>' +
      '</div></div>' +
    '<table><thead><tr><th>Description</th><th class="c">Qty</th><th class="n">Amount</th><th class="n">Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="totals"><div class="sub-row"><span>Subtotal</span><span>' + money(inv.subtotal) + '</span></div>' +
      '<div class="due"><span>TOTAL DUE</span><b>' + money(inv.total) + '</b></div></div>' +
    (co.payment_note ? '<div class="pay"><div class="t">Payment</div><p>' + esc(co.payment_note) + '</p></div>' : '') +
    (logo ? '<img class="watermark" alt="" src="' + logo + '">' : '') +
    '<div class="spacer"></div>' +
    (co.footer_note ? '<div class="thanks">' + esc(co.footer_note) + '</div><div class="rule"></div>' : '') +
    '<div class="foot">' + footer + '</div>';
  document.title = 'Invoice ' + inv.invoice_number + ' – ' + (inv.job_site || inv.bill_to || '');
  var subject = 'Invoice ' + inv.invoice_number + ' from ' + (co.display_name || '');
  var body = 'Hello,\n\nPlease find invoice ' + inv.invoice_number + ' for ' + money(inv.total) + (inv.job_site ? ' (job site: ' + inv.job_site + ')' : '') + ' attached.\n\n' + (co.footer_note || 'Thank you.') + '\n' + (co.display_name || '');
  document.getElementById('mailBtn').href = 'mailto:?cc=' + encodeURIComponent(emails.join(',')) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
});
</script>
</body>
</html>
