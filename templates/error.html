<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{ code }} – BSynch</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--accent:#0f766e;--btn:#0f766e}
@media (prefers-color-scheme: dark){:root{--bg:#0f1117;--card:#161a24;--text:#e2e8f0;--muted:#94a3b8;--line:#2a2f3d;--accent:#5eead4}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 26px;max-width:420px;width:100%;text-align:center}
.code{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
h1{font-size:20px;margin:12px 0 6px}
p{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:11px 18px;border-radius:10px;font-weight:700;text-decoration:none}
a.go{background:var(--btn);color:#fff}
a.alt{border:1px solid var(--line);color:var(--text)}
</style>
</head>
<body>
<main class="card">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="row">
    <a class="go" href="/home">Go to BSynch</a>
    <a class="alt" href="javascript:history.back()">Go back</a>
  </div>
</main>
</body>
</html>
