<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signed Agreement – BSynch</title>
<script>window.CT_SKIP_AGREEMENT = true;</script>
<script src="/static/contractor-scope.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:#e5e7eb;color:#111827;}
.toolbar{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:12px;background:#111827;font-family:'Segoe UI',system-ui,sans-serif;}
.toolbar button{padding:9px 18px;border-radius:8px;border:none;font-weight:700;font-size:14px;cursor:pointer;}
.b-print{background:#1e9484;color:#fff;}
.b-back{background:#374151;color:#e5e7eb;}
.page{max-width:800px;margin:24px auto;background:#fff;padding:56px 60px;box-shadow:0 4px 24px rgba(0,0,0,.12);}
@media(max-width:640px){.page{padding:28px 20px;margin:0;}}
.doc{white-space:pre-wrap;font-size:13.5px;line-height:1.65;}
.sig-block{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:28px;page-break-inside:avoid;}
@media(max-width:640px){.sig-block{grid-template-columns:1fr;}}
.sig-block img{max-width:100%;height:110px;object-fit:contain;display:block;border-bottom:1px solid #111827;}
.lbl{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;}
.val{font-size:15px;margin-top:2px;}
.meta{margin-top:28px;padding-top:14px;border-top:1px solid #d1d5db;font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;color:#6b7280;line-height:1.6;word-break:break-all;}
.msg{text-align:center;padding:60px 20px;font-family:'Segoe UI',system-ui,sans-serif;color:#6b7280;}
@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .page{box-shadow:none;margin:0;max-width:none;padding:0;}
  @page{margin:18mm;}
}
</style>
</head>
<body>
<div class="toolbar">
  <button class="b-back" onclick="history.back()">&#8592; Back</button>
  <button class="b-print" onclick="window.print()">&#128424; Print / Save PDF</button>
</div>
<div class="page" id="page"><div class="msg">Loading&hellip;</div></div>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
fetch('/api/contractor/agreements/' + encodeURIComponent({{ agreement_id|tojson }})).then(function(r){ return r.json(); }).then(function(d){
  var page = document.getElementById('page');
  if(!d.ok){ page.innerHTML = '<div class="msg">' + (d.error === 'not allowed' ? 'You do not have access to this agreement.' : 'Agreement not found.') + '</div>'; return; }
  var a = d.agreement, when = new Date(a.signed_at), whenTxt = isNaN(when) ? '-' : when.toLocaleString();
  var sig = /^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(a.signature_png) ? a.signature_png : '';
  page.innerHTML = '<div class="doc">' + esc(a.agreement_text) + '</div>' +
    '<div class="sig-block">' +
      '<div>' + (sig ? '<img alt="Signature" src="' + sig + '">' : '') + '<div class="lbl">Signature</div></div>' +
      '<div><div class="val">' + esc(a.signer_name) + '</div><div class="lbl">Full name</div>' +
      '<div class="val" style="margin-top:14px;">' + esc(whenTxt) + '</div><div class="lbl">Date signed</div></div>' +
    '</div>' +
    '<div class="meta">Electronically signed in BSynch &middot; Account: ' + esc(a.user_name) + (a.company ? ' &middot; Company: ' + esc(a.company) : '') +
    ' &middot; Version ' + esc(a.version) + ' &middot; Record ' + esc(a.id) + '<br>IP ' + esc(a.ip || '-') + ' &middot; ' + esc(a.user_agent || '') + '</div>';
  document.title = 'Agreement – ' + a.signer_name;
});
</script>
</body>
</html>
