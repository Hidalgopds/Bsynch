# Runs every test on each push to main and on pull requests (Settings, 2026-11-22).
# The tests use a fake Supabase in memory: no secrets, no internet, never the real database.
# Render: Settings -> Build & Deploy -> Auto-Deploy "After CI Checks Pass", so a red run never goes live.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests
        env:
          CT_SCHEDULER: "0"
        run: python tests/run_all.py
